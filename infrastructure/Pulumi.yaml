# Pulumi project descriptor. Read by any `pulumi` command from this directory.
# Stack-specific values live in Pulumi.<stack>.yaml.

name: modelserve
description: AWS infrastructure for the ModelServe inference platform.
runtime:
  name: python
  options:
    # Pulumi auto-activates infrastructure/.venv before loading __main__.py,
    # so `pulumi up` works without sourcing the venv manually.
    virtualenv: .venv
