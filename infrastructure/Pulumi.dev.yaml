# Stack config for the `dev` stack.
#
# Two namespaces:
#   aws:<key>          - config the pulumi-aws provider reads directly
#   modelserve:<key>   - custom config our code reads via pulumi.Config()

config:
  # AWS provider
  aws:region: ap-southeast-1

  # Sandbox SCP denies iam:TagPolicy / iam:TagInstanceProfile, so
  # aws:defaultTags (which would auto-tag every resource including IAM
  # ones) breaks IAM creation. Off for the sandbox.
  # ignoreTags preserves tags on resources created during earlier successful
  # runs so pulumi doesn't try to untag them. Restore defaultTags in a real account.
  aws:ignoreTags:
    keys:
      - Project
      - Environment
      - ManagedBy

  # modelserve EC2 config
  # t2.micro is what the sandbox SCP allows. Larger types get ec2:RunInstances
  # denied. 1 GB RAM is tight for 6 services; user_data adds a 2 GB swap file.
  modelserve:instance_type: t2.micro

  # Public key from ssh-keygen, relative to infrastructure/.
  # Private key stays on this machine.
  modelserve:ssh_public_key_path: keys/modelserve.pub

  # user_data clones this. Public repo, no auth needed.
  modelserve:repo_url: https://github.com/rabbygit/MLOps-S2-Exam1-modelserve-capstone-starter
