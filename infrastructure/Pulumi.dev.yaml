# Stack config for the `dev` stack.
#
# Pulumi reads this when you run `pulumi up` (or any pulumi command)
# while `dev` is the active stack. Switch stacks with `pulumi stack
# select <name>`. A future `prod` stack would have its own
# Pulumi.prod.yaml with different values for the same keys.
#
# Two namespaces in play:
#   aws:<key>          — config for the pulumi-aws provider itself
#   modelserve:<key>   — custom config our code reads (Sessions 6-7+)

config:
  # ----- AWS provider config --------------------------------------------------
  # Region every AWS resource lands in
  aws:region: ap-southeast-1

  # NOTE: Poridhi sandbox SCP denies iam:TagPolicy / iam:TagInstanceProfile,
  # so `aws:defaultTags` (which would auto-tag every resource including IAM
  # ones) breaks IAM resource creation. Disabling it for the sandbox demo.
  # Existing tags on resources created during earlier successful runs are
  # preserved by ignoreTags below — pulumi won't try to remove them.
  # In a real account, restore the defaultTags block.
  aws:ignoreTags:
    keys:
      - Project
      - Environment
      - ManagedBy

  # ----- modelserve EC2 config (S6) ------------------------------------------
  # Bumps to t3.medium if t3.small OOMs the 6-service compose stack.
  modelserve:instance_type: t3.small

  # Path to the public key from `ssh-keygen`. Relative to infrastructure/.
  # The private key stays on this machine; only the .pub goes to AWS.
  modelserve:ssh_public_key_path: keys/modelserve.pub

  # user-data clones from here. Public repo, no auth needed.
  modelserve:repo_url: https://github.com/rabbygit/MLOps-S2-Exam1-modelserve-capstone-starter
