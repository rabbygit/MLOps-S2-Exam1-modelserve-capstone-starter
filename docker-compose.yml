services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [modelserve]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [modelserve]

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      # Local default writes to the volume. EC2 user_data sets this to
      # s3://<bucket> so artifacts land in the durable bucket (ADR-3).
      MLFLOW_DEFAULT_ARTIFACT_ROOT: ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/mlartifacts}
    volumes:
      # Only used when MLFLOW_DEFAULT_ARTIFACT_ROOT is the local path. Harmless on EC2.
      - mlflow_artifacts:/mlartifacts
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:5000/health\",timeout=3).status==200 else 1)'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks: [modelserve]

  api:
    # Same compose file works two ways:
    #   local: `docker compose build api` builds and tags as modelserve-api:local
    #   EC2:   user_data sets API_IMAGE=<ecr-url>:latest, `pull` fetches from ECR
    build:
      context: .
      dockerfile: Dockerfile
    image: ${API_IMAGE:-modelserve-api:local}
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-fraud-detector}
      MODEL_STAGE: ${MODEL_STAGE:-Production}
      FEAST_REPO_PATH: /app/feast_repo
      REDIS_CONNECTION_STRING: redis:6379
    volumes:
      # Bind-mount feast_repo so registry.db updates are live in the
      # container without a rebuild. `materialize_features.py` then
      # `docker compose restart api` is enough.
      - ./feast_repo:/app/feast_repo:ro
    ports:
      - "8000:8000"
    networks: [modelserve]

  prometheus:
    image: prom/prometheus:v2.51.0
    # --web.enable-lifecycle lets us reload rules via SIGHUP or
    # POST /-/reload without restarting the container.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [modelserve]

  grafana:
    image: grafana/grafana:10.4.2
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Default admin password. Override via .env for anything non-dev.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Skip the post-login "change password" wall.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # No update banners / phone-home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Provisioning files (datasources + dashboard provider). Read-only
      # so Grafana can't mutate them.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSONs. Read-write so allowUiUpdates: true works.
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      # Persistent state (users, plugins, sqlite). Survives `down`.
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks: [modelserve]

volumes:
  postgres_data:
  mlflow_artifacts:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  modelserve:
    driver: bridge
