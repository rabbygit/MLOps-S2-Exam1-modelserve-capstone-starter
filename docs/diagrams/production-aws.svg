<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .title    { font-size: 20px; font-weight: 600; fill: #1a1a1a; }
      .subtitle { font-size: 12px; fill: #555; }
      .label    { font-size: 13px; fill: #1a1a1a; }
      .port     { font-size: 11px; fill: #555; font-family: 'SF Mono', Menlo, monospace; }
      .edge     { font-size: 11px; fill: #555; }
      .legend   { font-size: 11px; fill: #444; font-family: 'SF Mono', Menlo, monospace; }
      .svc-name { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .container-label { font-size: 12px; font-weight: 600; }
      .note     { font-size: 11px; fill: #666; font-style: italic; }
    </style>
  </defs>

  <rect width="1080" height="900" fill="#fafafa"/>

  <text x="40" y="36" class="title">Production · single AWS EC2</text>
  <text x="40" y="56" class="subtitle">pulumi up   ·   region: ap-southeast-1   ·   same docker-compose.yml as local, two env-var overrides</text>

  <!-- Public internet -->
  <rect x="40" y="80" width="1000" height="58" rx="6" fill="#ffffff" stroke="#bbb" stroke-dasharray="3 2"/>
  <text x="56" y="100" font-size="12" fill="#888" font-weight="600">Public internet</text>
  <text x="56" y="122" class="label">curl  →  http://&lt;ec2-public-ip&gt;:8000      Browser  →  http://&lt;ec2-public-ip&gt;:3000  (Grafana)</text>

  <path d="M 540 138 L 540 162" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arrow2)"/>

  <!-- AWS account outer box -->
  <rect x="40" y="170" width="1000" height="620" rx="10" fill="#fff8ec" stroke="#cc8800" stroke-width="1.5"/>
  <text x="56" y="192" class="container-label" fill="#a06600">AWS Account · ap-southeast-1</text>

  <!-- VPC -->
  <rect x="60" y="210" width="700" height="500" rx="8" fill="#ffffff" stroke="#7a9fc2" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="76" y="230" class="container-label" fill="#3a6b9a">VPC  10.0.0.0/16</text>

  <!-- Internet Gateway -->
  <rect x="100" y="250" width="160" height="38" rx="4" fill="#f7e5d4" stroke="#8a4d1f" stroke-width="1.3"/>
  <text x="180" y="274" text-anchor="middle" class="label">Internet Gateway</text>
  <text x="280" y="273" class="edge">default route 0.0.0.0/0</text>

  <!-- Public Subnet -->
  <rect x="100" y="305" width="640" height="380" rx="6" fill="#f4f8fc" stroke="#7a9fc2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="116" y="324" class="container-label" fill="#3a6b9a">Public Subnet  10.0.1.0/24  (map_public_ip_on_launch)</text>

  <!-- EC2 instance box -->
  <rect x="130" y="345" width="580" height="320" rx="6" fill="#fffaf2" stroke="#cc8800" stroke-width="1.3"/>
  <text x="146" y="364" class="container-label" fill="#a06600">EC2 t2.micro  (modelserve-host)</text>
  <text x="146" y="380" class="port">AL2023 ECS-hvm AMI · 30 GB gp3 · 2 GB swapfile</text>

  <!-- Bootstrap box -->
  <rect x="146" y="392" width="270" height="106" rx="4" fill="#ffffff" stroke="#bbb"/>
  <text x="156" y="408" font-size="11" fill="#444" font-weight="600">user_data.sh (first boot)</text>
  <text x="156" y="424" class="legend">• swapfile + docker + python</text>
  <text x="156" y="438" class="legend">• git clone main</text>
  <text x="156" y="452" class="legend">• download Kaggle dataset</text>
  <text x="156" y="466" class="legend">• train.py + materialize</text>
  <text x="156" y="480" class="legend">• docker compose build api &amp;&amp; up</text>

  <!-- Docker network on EC2 -->
  <rect x="430" y="392" width="270" height="106" rx="4" fill="#f4f8fc" stroke="#7a9fc2" stroke-dasharray="3 2"/>
  <text x="440" y="408" font-size="11" fill="#3a6b9a" font-weight="600">Docker network: modelserve</text>
  <text x="440" y="426" class="legend">postgres   redis   mlflow</text>
  <text x="440" y="442" class="legend">api        prometheus  grafana</text>
  <text x="440" y="466" class="note">same compose file as local;</text>
  <text x="440" y="480" class="note">MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://...</text>

  <!-- IAM Instance Profile -->
  <rect x="146" y="510" width="554" height="140" rx="4" fill="#fff8ec" stroke="#cc8800" stroke-dasharray="3 2"/>
  <text x="156" y="528" font-size="11" fill="#a06600" font-weight="600">IAM Instance Profile  ec2-host-role</text>
  <text x="156" y="548" class="legend">↳ ECR pull   (scoped to modelserve-api repo)</text>
  <text x="156" y="566" class="legend">↳ S3 r/w     (scoped to mlflow-artifacts bucket)</text>
  <text x="156" y="584" class="legend">↳ delivered via IMDSv2 · hop_limit=2 (so docker can reach IMDS)</text>
  <text x="156" y="616" font-size="11" fill="#444" font-weight="600">Security Group ingress (0.0.0.0/0):</text>
  <text x="156" y="632" class="legend">22 ssh   8000 api   3000 grafana   5000 mlflow   9090 prom</text>

  <!-- Stateful resources outside VPC -->
  <text x="790" y="230" class="container-label" fill="#a06600">Stateful (outside VPC)</text>

  <rect x="790" y="250" width="240" height="84" rx="6" fill="#d4f7d4" stroke="#2d6e2d" stroke-width="1.3"/>
  <text x="910" y="274" text-anchor="middle" class="svc-name">S3  ·  mlflow-artifacts</text>
  <text x="910" y="294" text-anchor="middle" class="port">versioned · locked</text>
  <text x="910" y="310" text-anchor="middle" class="port">7-day lifecycle expiry</text>
  <text x="910" y="326" text-anchor="middle" class="port">(orphan cleanup)</text>

  <rect x="790" y="350" width="240" height="84" rx="6" fill="#d4f7d4" stroke="#2d6e2d" stroke-width="1.3"/>
  <text x="910" y="374" text-anchor="middle" class="svc-name">ECR  ·  modelserve-api</text>
  <text x="910" y="394" text-anchor="middle" class="port">scan-on-push</text>
  <text x="910" y="410" text-anchor="middle" class="port">force_delete=True</text>
  <text x="910" y="426" text-anchor="middle" class="port">populated by CI</text>

  <!-- Edges from EC2 to S3/ECR -->
  <path d="M 700 558 C 760 558, 780 360, 790 292" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <text x="710" y="455" class="edge">boto3 in mlflow</text>
  <text x="710" y="470" class="edge">(creds via IMDS)</text>

  <path d="M 700 540 C 750 480, 770 420, 790 392" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
  <text x="730" y="525" class="edge">docker pull</text>

  <!-- Public IP arrow into EC2 -->
  <path d="M 540 162 C 540 200, 350 240, 350 345" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <text x="370" y="290" class="edge">public IP</text>

  <!-- CI auth note -->
  <rect x="60" y="725" width="970" height="50" rx="6" fill="#ffffff" stroke="#bbb" stroke-dasharray="3 2"/>
  <text x="74" y="744" font-size="12" fill="#444" font-weight="600">CI auth</text>
  <text x="74" y="762" class="legend">Sandbox AWS creds passed straight to GitHub Secrets. A dedicated `ci` IAM user would be cleaner; sandbox SCP denies iam:CreateUser.</text>

  <!-- Off-AWS deps -->
  <text x="40" y="810" font-size="12" fill="#444" font-weight="600">Off-AWS dependencies</text>
  <text x="40" y="828" class="legend">GitHub  (source repo cloned by user_data.sh)</text>
  <text x="40" y="844" class="legend">Kaggle  (dataset downloaded once per cold-start, unauthenticated endpoint)</text>
  <text x="40" y="860" class="legend">Docker Hub  (postgres, redis, prometheus, grafana base images)</text>
</svg>
