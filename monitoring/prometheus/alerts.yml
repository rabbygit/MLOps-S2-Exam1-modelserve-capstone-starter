# Prometheus alert rules for ModelServe.
#
# Mounted at /etc/prometheus/alerts.yml in the prometheus container,
# referenced from prometheus.yml's `rule_files`. Reload Prometheus
# (`docker compose kill -s SIGHUP prometheus`) after editing, or it
# picks them up on the next restart.
#
# All metric names come from app/metrics.py. Job label `modelserve-api`
# matches the scrape_configs job_name in prometheus.yml.

groups:
  - name: modelserve-api
    interval: 30s            # how often this group is evaluated (overrides global)
    rules:

      # ---------------------------------------------------------------
      # 1. SERVICE DOWN — the scraper can't reach /metrics for >1 min.
      # ---------------------------------------------------------------
      - alert: APIServiceDown
        expr: up{job="modelserve-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: modelserve-api
        annotations:
          summary: "ModelServe API is down"
          description: |
            Prometheus has been unable to scrape the FastAPI /metrics
            endpoint for over 1 minute on instance {{ $labels.instance }}.
            Predictions are unavailable. Check `docker compose ps api`
            and `docker compose logs api`.

      # ---------------------------------------------------------------
      # 2. HIGH LATENCY (p95) — 95th-percentile prediction latency stays
      #    above 500 ms for 5 min. The histogram exposes _bucket series
      #    we can pipe into histogram_quantile().
      # ---------------------------------------------------------------
      - alert: HighPredictionLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(prediction_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: modelserve-api
        annotations:
          summary: "p95 prediction latency above 500ms"
          description: |
            95th-percentile end-to-end prediction latency has been above
            500 ms for the last 5 minutes (current: {{ $value | printf "%.3f" }}s).
            Likely culprits: Feast/Redis slowness, model load contention,
            or worker saturation. Check the Grafana ModelServe dashboard.

      # ---------------------------------------------------------------
      # 3. HIGH ERROR RATE — more than 5% of predictions are failing
      #    over the last 2 min. Excludes the 'no traffic' case by also
      #    requiring at least 0.1 req/s of traffic to avoid flapping.
      # ---------------------------------------------------------------
      - alert: HighPredictionErrorRate
        expr: |
          (
            sum(rate(prediction_errors_total[2m]))
            /
            sum(rate(prediction_requests_total[2m]))
          ) > 0.05
          and
          sum(rate(prediction_requests_total[2m])) > 0.1
        for: 2m
        labels:
          severity: warning
          service: modelserve-api
        annotations:
          summary: "Prediction error rate above 5%"
          description: |
            More than 5% of /predict calls are failing over the last 2 minutes
            (current rate: {{ $value | printf "%.2%" }}).
            Inspect prediction_errors_total{reason} to see if it's
            missing_features (404s — entity not materialized) or
            model_error (500s — code/data issue).

      # ---------------------------------------------------------------
      # 4. FEAST MISS RATE — system-specific. High misses means materialize
      #    didn't cover the entities being predicted on. Same anti-flap
      #    guard as the error rate alert.
      # ---------------------------------------------------------------
      - alert: FeastHighMissRate
        expr: |
          (
            sum(rate(feast_online_store_misses_total[5m]))
            /
            sum(rate(feast_online_store_misses_total[5m]) + rate(feast_online_store_hits_total[5m]))
          ) > 0.20
          and
          sum(rate(feast_online_store_misses_total[5m]) + rate(feast_online_store_hits_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: modelserve-api
        annotations:
          summary: "Feast online-store miss rate above 20%"
          description: |
            More than 20% of feature lookups are missing in Redis over
            the last 5 minutes. Re-run `python scripts/materialize_features.py`
            on the host, or investigate whether new entities are appearing
            that haven't been materialized yet.