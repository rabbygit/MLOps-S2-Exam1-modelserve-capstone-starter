# Prometheus alert rules for ModelServe.
#
# Mounted at /etc/prometheus/alerts.yml. Referenced from prometheus.yml's
# rule_files. Reload Prometheus with `docker compose kill -s SIGHUP prometheus`
# after editing, or just restart it.
#
# Metric names are from app/metrics.py. Job label `modelserve-api` matches
# the scrape_configs job_name in prometheus.yml.

groups:
  - name: modelserve-api
    interval: 30s            # this group's eval cadence (overrides global)
    rules:

      # 1. SERVICE DOWN. Scraper can't reach /metrics for > 1 min.
      - alert: APIServiceDown
        expr: up{job="modelserve-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: modelserve-api
        annotations:
          summary: "ModelServe API is down"
          description: |
            Prometheus hasn't scraped /metrics on {{ $labels.instance }}
            for over a minute. Predictions are unavailable.
            Check `docker compose ps api` and `docker compose logs api`.

      # 2. HIGH LATENCY (p95). p95 above 500 ms for 5 min.
      # The histogram's _bucket series feed into histogram_quantile().
      - alert: HighPredictionLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(prediction_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: modelserve-api
        annotations:
          summary: "p95 prediction latency above 500ms"
          description: |
            p95 latency above 500 ms for 5 min (current: {{ $value | printf "%.3f" }}s).
            Likely Feast/Redis slowness, model load contention, or worker
            saturation. Check the Grafana dashboard.

      # 3. HIGH ERROR RATE. > 5% errors for 2 min. Anti-flap guard:
      # require >= 0.1 req/s of real traffic, otherwise zero-traffic noise
      # can trip the alert.
      - alert: HighPredictionErrorRate
        expr: |
          (
            sum(rate(prediction_errors_total[2m]))
            /
            sum(rate(prediction_requests_total[2m]))
          ) > 0.05
          and
          sum(rate(prediction_requests_total[2m])) > 0.1
        for: 2m
        labels:
          severity: warning
          service: modelserve-api
        annotations:
          summary: "Prediction error rate above 5%"
          description: |
            > 5% of /predict calls failing over 2 min (current: {{ $value | printf "%.2%" }}).
            Check prediction_errors_total{reason} to see if it's
            missing_features (404, entity not materialized) or
            model_error (500, code/data issue).

      # 4. FEAST MISS RATE. System-specific. High misses means materialize
      # didn't cover the entities being predicted on. Same anti-flap guard.
      - alert: FeastHighMissRate
        expr: |
          (
            sum(rate(feast_online_store_misses_total[5m]))
            /
            sum(rate(feast_online_store_misses_total[5m]) + rate(feast_online_store_hits_total[5m]))
          ) > 0.20
          and
          sum(rate(feast_online_store_misses_total[5m]) + rate(feast_online_store_hits_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: modelserve-api
        annotations:
          summary: "Feast online-store miss rate above 20%"
          description: |
            > 20% of feature lookups missing in Redis over 5 min.
            Re-run `python scripts/materialize_features.py` on the host,
            or check if new entities aren't materialized yet.
