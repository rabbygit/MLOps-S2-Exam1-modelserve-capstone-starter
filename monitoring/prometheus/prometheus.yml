# Prometheus config for ModelServe.
#
# Mounted at /etc/prometheus/prometheus.yml inside the container.
# Source on the host: monitoring/prometheus/prometheus.yml.

global:
  # How often Prometheus pulls /metrics from each target.
  scrape_interval: 15s

  # How often alert rules are evaluated. Keep >= scrape_interval so each
  # evaluation has fresh data.
  evaluation_interval: 15s

  # Hard cap per scrape so a hanging target doesn't tie up the scraper.
  scrape_timeout: 10s

# Alert rule files. Glob patterns allowed.
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape jobs. job_name becomes a `job=<name>` label on every scraped series,
# which is what alerts and dashboards filter on.
scrape_configs:

  # Self-scrape. Useful for debugging the scraper itself
  # (up{job="prometheus"}, prometheus_tsdb_head_series, etc).
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # FastAPI inference service. /metrics is in app/metrics.py and routed
  # in app/main.py. `api` resolves via Docker compose DNS.
  - job_name: modelserve-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: modelserve-api
          environment: dev
