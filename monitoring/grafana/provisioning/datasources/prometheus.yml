# Grafana datasource provisioning.
#
# Mounted at /etc/grafana/provisioning/datasources/prometheus.yml
# inside the Grafana container. Grafana scans that directory at
# startup and creates/updates datasources from these files

apiVersion: 1

datasources:
  - name: Prometheus
    # Explicit UID so the modelserve.json dashboard can reference this
    # datasource by uid: "prometheus" instead of a random UUID Grafana
    # would otherwise auto-generate.
    uid: prometheus
    type: prometheus
    # `proxy` = Grafana queries Prometheus on behalf of the browser
    # (server-side). Required when Prometheus is reachable on the
    # docker network but not from the user's browser.
    access: proxy
    # Service-name DNS — `prometheus` is the compose service name
    url: http://prometheus:9090
    isDefault: true
    # Disabled in the UI, prevent accidentally edit
    editable: false
    jsonData:
      # Match the scrape_interval in prometheus.yml so step-aware
      # queries (rate, increase) compute over the right window.
      timeInterval: 15s
