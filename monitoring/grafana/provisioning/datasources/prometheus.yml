# Grafana datasource provisioning.
#
# Mounted at /etc/grafana/provisioning/datasources/prometheus.yml. Grafana
# scans that dir at startup and creates/updates datasources from it.

apiVersion: 1

datasources:
  - name: Prometheus
    # Explicit UID so modelserve.json can reference the datasource by
    # uid: "prometheus" instead of an auto-generated UUID.
    uid: prometheus
    type: prometheus
    # proxy = Grafana queries Prometheus server-side. Needed because
    # Prometheus is on the docker network, not reachable from the browser.
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Disabled in the UI to prevent accidental edits.
    editable: false
    jsonData:
      # Match prometheus.yml's scrape_interval so step-aware queries
      # (rate, increase) compute over the right window.
      timeInterval: 15s
