# Grafana dashboard *provider* configuration.
#
# Mounted at /etc/grafana/provisioning/dashboards/dashboard.yml inside
# the Grafana container. This file does NOT contain a dashboard — it
# tells Grafana WHERE to look for dashboard JSON files. The actual
# dashboards live next to it (monitoring/grafana/dashboards/
# modelserve.json) and are mounted into the container at the path
# referenced by `options.path` below.

apiVersion: 1

providers:
  - name: modelserve
    # `file` provider = read .json dashboards from a local directory.
    type: file
    # Folder shown in the Grafana UI sidebar. "" = top-level "General".
    folder: ""
    # How often Grafana rescans the directory for added/changed files.
    # 10s is fine for dev; production usually 30-60s.
    updateIntervalSeconds: 10
    # Lets the user save tweaks made in the UI back to the .json on
    # disk. Useful while iterating; flip to false in prod so the
    # provisioning file stays the source of truth.
    allowUiUpdates: true
    options:
      # Container-internal path where the dashboard JSONs are mounted.
      # Compose will bind monitoring/grafana/dashboards (host) to this.
      path: /var/lib/grafana/dashboards
      # Optional: when true, dashboards added to the file system show
      # up in Grafana folders matching their subdirectory. Off here
      # because we have a flat single-folder layout.
      foldersFromFilesStructure: false
