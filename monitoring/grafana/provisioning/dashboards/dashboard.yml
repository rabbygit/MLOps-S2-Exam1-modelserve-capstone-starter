# Grafana dashboard *provider* config.
#
# Mounted at /etc/grafana/provisioning/dashboards/dashboard.yml. This file
# does NOT contain a dashboard. It tells Grafana where to look for
# dashboard JSONs. The actual dashboards live in
# monitoring/grafana/dashboards/ and are mounted into the container at
# `options.path` below.

apiVersion: 1

providers:
  - name: modelserve
    # `file` = read .json dashboards from a local directory.
    type: file
    # Folder shown in the UI sidebar. "" = top-level General.
    folder: ""
    # How often Grafana rescans for added/changed files. 10s for dev,
    # 30-60s in prod.
    updateIntervalSeconds: 10
    # Lets the UI save tweaks back to the .json on disk. Off in prod so
    # the provisioning file stays the source of truth.
    allowUiUpdates: true
    options:
      # Container-internal path where dashboard JSONs are mounted.
      path: /var/lib/grafana/dashboards
      # If true, subdirectories show up as folders in the UI. Off here;
      # flat layout.
      foldersFromFilesStructure: false
